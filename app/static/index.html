<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>Persian OCR</title>
  <style>
    :root { --bg:#111; --card:#1b1b1b; --line:#2a2a2a; --ok:#7dffa3; --muted:#aaa; }
    body { font-family: Tahoma, sans-serif; max-width: 920px; margin: 24px auto; background: var(--bg); color: #eee; padding: 0 16px; }
    h1 { font-size: 1.25rem; margin-bottom: 6px; }
    p.lead { color: var(--muted); margin-top: 0; }
    .box { background: var(--card); padding: 16px; border-radius: 10px; margin-top: 12px; border: 1px solid var(--line); }
    label { margin-inline-start: 10px; }
    button { padding: 8px 18px; cursor: pointer; margin-inline-start: 10px; }
    img { max-width: 100%; border-radius: 8px; display: block; }
    ol { direction: rtl; padding-inline-start: 1.4rem; }
    li { margin: 6px 0; font-size: 1.05rem; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    pre { white-space: pre-wrap; direction: rtl; font-size: 0.8rem; color: #ccc; max-height: 280px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Persian scene OCR</h1>
    <p class="lead">Upload an image. Each box is one text block — separate signs on the same row stay separate. Numbers match the list below (top→bottom, then right→left).</p>
  <div class="box">
    <form id="f">
      <input type="file" name="file" id="file" accept="image/*" required />
      <button type="submit">Run OCR</button>
    </form>
  </div>
  <div class="box">
    <h2>Image + bounding boxes</h2>
    <img id="preview" alt="" />
    <p id="meta" class="muted"></p>
    <h2>Text blocks</h2>
    <pre id="full"></pre>
    <ol id="lines"><li class="muted">No image yet.</li></ol>
  </div>
  <div class="box">
    <h2>Raw JSON</h2>
    <pre id="json"></pre>
  </div>
  <script>
    const f = document.getElementById("f");
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const file = document.getElementById("file").files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append("file", file);
      document.getElementById("lines").innerHTML = "<li>Processing…</li>";
      document.getElementById("full").textContent = "";
      document.getElementById("meta").textContent = "";
      try {
        const res = await fetch("/ocr", { method: "POST", body: fd });
        const data = await res.json();
        const shown = Object.assign({}, data);
        delete shown.annotated_jpeg_b64;
        document.getElementById("json").textContent = JSON.stringify(shown, null, 2);
        if (!res.ok) {
          document.getElementById("lines").innerHTML = "<li>Server error: " + (data.detail || res.status) + "</li>";
          return;
        }
        const n = data.n_boxes || 0;
        document.getElementById("meta").textContent =
          "blocks: " + (data.n_blocks || data.n_sentences || 0) + "  |  words: " + n + "  |  " + data.elapsed_ms + " ms  |  " + data.device;
        document.getElementById("full").textContent = (data.text || "").trim() || "(empty)";
        if (data.annotated_jpeg_b64) {
          document.getElementById("preview").src = "data:image/jpeg;base64," + data.annotated_jpeg_b64;
        } else {
          document.getElementById("preview").src = URL.createObjectURL(file);
        }
        const items = data.items || [];
        if (!items.length) {
          document.getElementById("lines").innerHTML = "<li>No text boxes found. Use a clear photo with large, high-contrast Persian text.</li>";
          return;
        }
        document.getElementById("lines").innerHTML = items.map((it, i) => {
          const t = (it.text || "").trim() || "(empty)";
          return "<li>" + t + "</li>";
        }).join("");
      } catch (err) {
        document.getElementById("lines").innerHTML = "<li>Cannot reach the API. Start it with python -m app.api — " + err + "</li>";
      }
    });
  </script>
</body>
</html>
