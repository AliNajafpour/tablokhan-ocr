<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Persian OCR</title>
<style>
*{box-sizing:border-box} body{font:16px Tahoma;max-width:900px;margin:auto;padding:20px;background:#111;color:#eee}
h1{text-align:center} form,section{background:#1b1b1b;padding:16px;margin:12px 0;border-radius:10px}
form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px} label{display:grid;gap:8px;min-width:0}
.file,.run{grid-column:1/-1} input,button,select{min-height:44px;font:inherit} select{width:100%;padding:8px} button{cursor:pointer}
select:disabled{opacity:.4} img{display:block;max-width:100%;margin:auto} img:not([src]){display:none} li{margin:7px} .muted{color:#aaa}
@media(max-width:650px){form{grid-template-columns:1fr}.file,.run{grid-column:auto}}
</style>
<h1>Persian OCR</h1>
<form id="form">
  <label class="file" for="file">Image <input id="file" type="file" accept="image/*" required></label>
  <label for="mode">Mode <select id="mode"><option value="ocr">Full OCR</option><option value="detection">Detection only</option><option value="recognition">Recognition only</option></select></label>
  <label for="detection">Detection <select id="detection"></select></label>
  <label for="recognition">Recognition <select id="recognition"></select></label>
  <button class="run" type="submit">Run</button>
</form>
<section>
  <p id="meta" class="muted"></p>
  <img id="image" alt="OCR result">
  <ol id="texts" aria-live="polite"><li dir="auto">Choose an image.</li></ol>
</section>
<script>
const get=id=>document.getElementById(id),form=get("form"),file=get("file"),texts=get("texts"),meta=get("meta"),image=get("image"),mode=get("mode"),detection=get("detection"),recognition=get("recognition")
fetch("/models").then(response=>response.json()).then(models=>{
  for(const [select,names] of [[detection,models.detection],[recognition,models.recognition]])
    select.innerHTML=names.map(name=>`<option>${name}</option>`).join("")
})
mode.onchange=()=>{
  detection.disabled=mode.value==="recognition"
  recognition.disabled=mode.value==="detection"
}
form.onsubmit=async event=>{
  event.preventDefault()
  texts.innerHTML='<li dir="auto">Processing…</li>'
  const data=new FormData()
  data.append("file",file.files[0])
  data.append("mode",mode.value)
  data.append("detection_model",detection.value)
  data.append("recognition_model",recognition.value)
  try{
    const response=await fetch("/ocr",{method:"POST",body:data})
    const result=await response.json()
    if(!response.ok)throw Error(result.detail||response.status)
    meta.textContent=`${result.mode==="detection"?"boxes":"results"}: ${result.n_boxes} | ${result.elapsed_ms} ms`
    image.src="data:image/jpeg;base64,"+result.annotated_jpeg_b64
    texts.innerHTML=result.mode==="detection"?`<li dir="auto">${result.n_boxes} boxes found.</li>`:result.words.map(word=>`<li dir="auto">${word.text||"(empty)"}</li>`).join("")||'<li dir="auto">No text found.</li>'
  }catch(error){texts.innerHTML=`<li dir="auto">${error}</li>`}
}
</script>
</html>
